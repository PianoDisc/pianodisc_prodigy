name: Feature request
description: Suggest something the integration should be able to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe what you want to achieve with your piano, rather than the change you have
        in mind. Knowing the goal often reveals a better way to support it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your idea for how this could work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Anything you've already attempted, and why it fell short.
