blueprint:
  name: PianoDisc show control channel
  description: >-
    Tie one MIDI Show Control channel of a PianoDisc Prodigy II to anything in Home
    Assistant. Pick the channel, then say what "on" and "off" mean for it: turn a lamp
    on and off, start and stop a pump, activate a scene that sets a DMX fixture to a
    colour and another that clears it. GO runs the on actions, STOP runs the off
    actions, and FIRE flashes: on, wait, off. Create one automation from this
    blueprint for each channel you use; channel numbers mean the same thing in every
    song.
  domain: automation
  author: PianoDisc
  source_url: https://github.com/PianoDisc/pianodisc_prodigy/blob/main/blueprints/automation/pianodisc_prodigy/show_control_channel.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    channel:
      name: Channel
      description: The channel's cue event on the piano's Show Control device.
      selector:
        entity:
          filter:
            integration: pianodisc_prodigy
            domain: event
    on_actions:
      name: "On"
      description: >-
        What "on" means for this channel. Runs on GO, and at the start of a FIRE flash.
        For a lamp or a pump, a turn-on action. For a DMX fixture, activate a scene
        that sets its brightness and colour.
      default: []
      selector:
        action: {}
    off_actions:
      name: "Off"
      description: >-
        What "off" means for this channel. Runs on STOP, and at the end of a FIRE
        flash unless the channel is on. Usually the reverse of On.
      default: []
      selector:
        action: {}
    flash_ms:
      name: Flash length
      description: How long a FIRE cue holds the channel on before running Off.
      default: 100
      selector:
        number:
          min: 20
          max: 5000
          step: 10
          unit_of_measurement: ms
          mode: box

# Parallel so a burst of FIRE cues never delays the GO or STOP that follows it.
mode: parallel
max: 25

triggers:
  # The cue event's state is the time of its last cue, so every cue is a state
  # change. Exclude availability transitions so a restart or reload never triggers.
  - trigger: state
    entity_id: !input channel
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown

variables:
  channel: !input channel
  command: "{{ trigger.to_state.attributes.event_type }}"
  cue: "{{ trigger.to_state.attributes.cue | default('') }}"

actions:
  - choose:
      - conditions: "{{ command == 'go' }}"
        sequence: !input on_actions
      - conditions: "{{ command == 'stop' }}"
        sequence: !input off_actions
      - conditions: "{{ command == 'fire' }}"
        sequence:
          - sequence: !input on_actions
          - delay:
              milliseconds: !input flash_ms
          # A flash while the channel is on (a GO is active) leaves it on.
          - if:
              - condition: template
                value_template: "{{ not state_attr(channel, 'channel_on') }}"
            then:
              - sequence: !input off_actions
