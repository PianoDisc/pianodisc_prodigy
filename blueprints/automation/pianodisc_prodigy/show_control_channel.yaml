blueprint:
  name: PianoDisc show control channel
  description: >-
    Tie one MIDI Show Control channel of a PianoDisc Prodigy II to anything in Home
    Assistant. Pick the channel, then choose what happens on its GO cue, on STOP, and
    optionally on each FIRE cue. Each is an ordinary action list: turn a lamp on, start
    a pump, activate a scene that sets a DMX fixture to a colour, run a script. Create
    one automation from this blueprint for each channel you use; channel numbers mean
    the same thing in every song.
  domain: automation
  author: PianoDisc
  source_url: https://github.com/PianoDisc/pianodisc_prodigy/blob/main/blueprints/automation/pianodisc_prodigy/show_control_channel.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    channel:
      name: Channel
      description: The channel's cue event on the piano's Show Control device.
      selector:
        entity:
          filter:
            integration: pianodisc_prodigy
            domain: event
    go_actions:
      name: On GO
      description: >-
        What happens when the channel turns on. For a lamp or a pump, a turn-on action.
        For a DMX fixture, activate a scene that sets its brightness and colour.
      default: []
      selector:
        action: {}
    stop_actions:
      name: On STOP
      description: What happens when the channel turns off. Usually the reverse of GO.
      default: []
      selector:
        action: {}
    fire_actions:
      name: On FIRE
      description: >-
        What happens on each FIRE cue. A flash, a scene, a script. Leave empty on
        channels that never fire.
      default: []
      selector:
        action: {}

# Parallel so a burst of FIRE cues never delays the GO or STOP that follows it.
mode: parallel
max: 25

triggers:
  # The cue event's state is the time of its last cue, so every cue is a state
  # change. Exclude availability transitions so a restart or reload never triggers.
  - trigger: state
    entity_id: !input channel
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown

variables:
  command: "{{ trigger.to_state.attributes.event_type }}"
  cue: "{{ trigger.to_state.attributes.cue | default('') }}"

actions:
  - choose:
      - conditions: "{{ command == 'go' }}"
        sequence: !input go_actions
      - conditions: "{{ command == 'stop' }}"
        sequence: !input stop_actions
      - conditions: "{{ command == 'fire' }}"
        sequence: !input fire_actions
