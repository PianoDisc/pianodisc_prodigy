blueprint:
  name: PianoDisc show control channel
  description: >-
    Tie one MIDI Show Control channel of a PianoDisc Prodigy II to a light, switch,
    scene or script. GO turns the target on, STOP turns it off, FIRE pulses it and then
    restores it to the channel's state. Create one automation from this blueprint for
    each channel you use; channel numbers are the same in every song.
  domain: automation
  author: PianoDisc
  source_url: https://github.com/PianoDisc/pianodisc_prodigy/blob/main/blueprints/automation/pianodisc_prodigy/show_control_channel.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    channel:
      name: MSC channel
      description: The channel's on/off sensor on the piano's Show Control device.
      selector:
        entity:
          filter:
            integration: pianodisc_prodigy
            domain: binary_sensor
    fire:
      name: MSC channel fire
      description: The same channel's fire event entity.
      selector:
        entity:
          filter:
            integration: pianodisc_prodigy
            domain: event
    target:
      name: Target
      description: The light, switch, scene or script this channel drives.
      selector:
        target:
          entity: {}
    flash_ms:
      name: Flash length
      description: How long FIRE holds the target on before restoring it.
      default: 400
      selector:
        number:
          min: 50
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: box

# Parallel so a burst of FIRE cues never delays the GO or STOP that follows it.
mode: parallel
max: 25

triggers:
  - trigger: state
    entity_id: !input channel
    to: "on"
    id: go
  - trigger: state
    entity_id: !input channel
    from: "on"
    to: "off"
    id: stop
  # The event entity's state is the time of its last FIRE, so any state change is a
  # cue. Exclude availability transitions so a restart or reload never fires it.
  - trigger: state
    entity_id: !input fire
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: fire

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: go
        sequence:
          - action: homeassistant.turn_on
            target: !input target
      - conditions:
          - condition: trigger
            id: stop
        sequence:
          - action: homeassistant.turn_off
            target: !input target
      - conditions:
          - condition: trigger
            id: fire
        sequence:
          - action: homeassistant.turn_on
            target: !input target
          - delay:
              milliseconds: !input flash_ms
          # Restore the channel's state: a FIRE while the channel is on leaves it on.
          - if:
              - condition: state
                entity_id: !input channel
                state: "on"
            then: []
            else:
              - action: homeassistant.turn_off
                target: !input target
