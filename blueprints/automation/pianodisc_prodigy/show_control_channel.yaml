blueprint:
  name: PianoDisc show control channel
  description: >-
    Tie one MIDI Show Control channel of a PianoDisc Prodigy II to anything in Home
    Assistant. Choose what happens when the channel's GO cue arrives, what happens on
    STOP, and optionally what happens on each FIRE cue. Each is an ordinary action
    list: turn a lamp on, start a pump, activate a scene that sets a DMX fixture to a
    colour, run a script. Create one automation from this blueprint for each channel
    you use; channel numbers mean the same thing in every song.
  domain: automation
  author: PianoDisc
  source_url: https://github.com/PianoDisc/pianodisc_prodigy/blob/main/blueprints/automation/pianodisc_prodigy/show_control_channel.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    channel:
      name: MSC channel
      description: The channel's on/off sensor on the piano's Show Control device.
      selector:
        entity:
          filter:
            integration: pianodisc_prodigy
            domain: binary_sensor
    fire:
      name: MSC channel fire
      description: The same channel's fire event entity.
      selector:
        entity:
          filter:
            integration: pianodisc_prodigy
            domain: event
    go_actions:
      name: On GO
      description: >-
        What happens when the channel turns on. For a lamp or a pump, a turn-on action.
        For a DMX fixture, activate a scene that sets its brightness and colour.
      default: []
      selector:
        action: {}
    stop_actions:
      name: On STOP
      description: What happens when the channel turns off. Usually the reverse of GO.
      default: []
      selector:
        action: {}
    fire_actions:
      name: On FIRE
      description: >-
        What happens on each FIRE cue. A flash, a scene, a script. Leave empty on
        channels that never fire. The cue number is available as {{ cue }}.
      default: []
      selector:
        action: {}

# Parallel so a burst of FIRE cues never delays the GO or STOP that follows it.
mode: parallel
max: 25

triggers:
  - trigger: state
    entity_id: !input channel
    to: "on"
    id: go
  - trigger: state
    entity_id: !input channel
    from: "on"
    to: "off"
    id: stop
  # The event entity's state is the time of its last FIRE, so any state change is a
  # cue. Exclude availability transitions so a restart or reload never fires it.
  - trigger: state
    entity_id: !input fire
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: fire

variables:
  cue: "{{ trigger.to_state.attributes.cue | default('') }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: go
        sequence: !input go_actions
      - conditions:
          - condition: trigger
            id: stop
        sequence: !input stop_actions
      - conditions:
          - condition: trigger
            id: fire
        sequence: !input fire_actions
